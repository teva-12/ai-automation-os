# AI Automation OS - Phase 1 infrastructure
# Start:  docker compose up -d
# Tunnel (needed for Telegram webhooks from a home/laptop host):
#         docker compose --profile tunnel up -d
name: ai-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: aios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      AIOS_DB_PASSWORD: ${AIOS_DB_PASSWORD}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=off
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/migrations:/migrations:ro
    # No published ports: Postgres is reachable only from the internal network.
    networks: [aios]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: aios-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Editor bound to localhost only. Never expose 5678 publicly.
      - "127.0.0.1:5678:5678"
    environment:
      # --- database (n8n's own metadata DB, separate from app data) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # --- security ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # --- URLs (Telegram webhooks need a public HTTPS WEBHOOK_URL) ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # --- runtime ---
      GENERIC_TIMEZONE: ${TZ_LOCAL:-Africa/Cairo}
      TZ: ${TZ_LOCAL:-Africa/Cairo}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      # --- execution log hygiene ---
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336          # hours (14 days)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backups/n8n-export:/backup/n8n-export
    networks: [aios]
    deploy:
      resources:
        limits:
          memory: 1G

  # Optional: public HTTPS entry point for Telegram webhooks (no open ports).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aios-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on: [n8n]
    networks: [aios]

networks:
  aios:
    driver: bridge

volumes:
  pg_data:
  n8n_data:
